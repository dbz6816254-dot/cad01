[project]
name = "rebar-audit"
version = "0.1.0"
description = "캐드 철근 시공상세도와 가공도/송장 정합성 검증 도구"
requires-python = ">=3.12"
dependencies = [
    "ezdxf>=1.3",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "rich>=13.7",
    "typer>=0.12",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "reportlab>=4.0",
]

[project.scripts]
rebar-audit = "rebar_audit.cli:app"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/rebar_audit/cli.py" = ["B008"]  # typer 인자 기본값 패턴 허용

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
